<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disney World Wait Times</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app-header">
    <h1>Disney World Wait Times</h1>
</div>

<div class="park-tabs">

    <button id="mkBtn" class="tab active">
        MK
    </button>

    <button id="epBtn" class="tab">
        EP
    </button>

    <button id="hsBtn" class="tab">
        HS
    </button>

    <button id="akBtn" class="tab">
        AK
    </button>

</div>

<div class="lastUpdated">
    Last Updated:
    <span id="updatedTime"></span>
</div>

<div class="section">

    <h2>🔔 Ride Alerts</h2>

    <select id="alertRide"></select>

    <input
        id="alertWait"
        type="number"
        placeholder="Notify Below (minutes)">

    <button onclick="addAlert()">
        Add Alert
    </button>

    <div id="alerts"></div>

</div>

<div class="ride-card">
    <div id="rides"></div>
</div>

<script src="app.js"></script>

</body>
</html>
